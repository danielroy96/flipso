name: CI

on:
  push:
    # Not tags: release.yml builds those, and runs this workflow to do it.
    branches: ['**']
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: The release tag to check out and check, e.g. v1.1
        type: string
        required: true
    outputs:
      sdk:
        description: The firmware SDK version the .fap was built against
        value: ${{ jobs.build.outputs.sdk }}
      api:
        description: The firmware API version the .fap was built against
        value: ${{ jobs.build.outputs.api }}

permissions:
  contents: read

# A newer push to the same branch supersedes the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🧪 Host tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      # clang rather than the runner's default gcc, to match the Apple clang the
      # suite is written against on macOS.
      - name: tools/test/run.sh
        run: tools/test/run.sh -v
        env:
          CC: clang

  # The firmware's clang-format style, via .clang-format. `ufbt format` fixes it.
  lint:
    name: 🚨 Source lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      - uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          task: lint
          sdk-channel: release

  build:
    name: 🔧 Build .fap
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ fromJSON(steps.build.outputs.ufbt-status).version }}
      api: ${{ steps.build.outputs.api-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      # The release channel is the SDK the app is developed and deployed against
      # (ufbt's default state on the dev machine).
      - name: ufbt build
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1.4
        with:
          sdk-channel: release
      - uses: actions/upload-artifact@v4
        with:
          name: flipso-${{ steps.build.outputs.suffix }}
          path: ${{ steps.build.outputs.fap-artifacts }}
          if-no-files-found: error

  # The Apps Catalog's own bundler over this commit: the build, icon,
  # screenshots and markdown checks a catalog submission has to pass.
  catalog:
    name: 🏁 Flipper app catalog validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
      # The catalog's requirements pin Pillow 10.4, and its CI runs on 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: tools/catalog/validate.sh
        run: tools/catalog/validate.sh
      # Only for a release: every other commit is checked, but the catalog
      # should only ever be offered a tagged one.
      - name: Manifest to submit
        if: inputs.release
        env:
          TAG: ${{ inputs.release }}
        run: |
          {
            echo "## Apps Catalog manifest"
            echo
            # HEAD, not GITHUB_SHA: a release built by hand runs on main, and
            # GITHUB_SHA is main's commit rather than the tag's.
            echo "Valid for $TAG ($(git rev-parse --short HEAD)). To publish it in the catalog, submit it to"
            echo "[flipper-application-catalog](https://github.com/flipperdevices/flipper-application-catalog)"
            echo "as \`applications/NFC/flipso/manifest.yml\`."
            echo
            echo '```yaml'
            cat dist/catalog-manifest.yml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The bundle holds the icon and screenshots exactly as the catalog will
      # show them.
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-bundle
          path: dist/catalog-bundle.zip
          if-no-files-found: error
